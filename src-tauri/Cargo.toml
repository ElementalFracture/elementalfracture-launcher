[package]
name = "ef-launcher"
version = "3.3.0"
description = "Elemental Fracture Launcher"
authors = ["Elemental Fracture"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# The signed release manifest (download/manifest.rs): every payload's SHA-256,
# signed with a key the CDN never holds.
sha2 = "0.10"
ed25519-dalek = "2"
open = "5"
specta = { version = "2.0.0-rc.21", features = ["serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "javascript", "typescript"] }
specta-jsdoc = "0.0.9"

# The startup-failure dialog (main.rs `fatal`), and finding Steam (steam/client.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Reading Shift for quickstart (steam/quickstart.rs). Already in the tree through tao.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

# Free space before unpacking (platform.rs `free_space`). Already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
