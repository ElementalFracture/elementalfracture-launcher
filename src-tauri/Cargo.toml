[package]
name = "ef-launcher"
version = "3.1.1"
description = "Elemental Fracture Launcher"
authors = ["Elemental Fracture"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
open = "5"
specta = { version = "2.0.0-rc.21", features = ["serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "javascript", "typescript"] }
specta-jsdoc = "0.0.9"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
