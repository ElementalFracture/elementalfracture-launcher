# cdn-br.elefrac.com: TLS in front of the spoke's MinIO. Same shape as the hub's vhost on turing
# (/etc/nginx/sites-enabled/cdn.elefrac.com.conf). default_server so the mirror job can reach the S3 API
# by the host's unproxied name (play-br.elefrac.com) with the same certificate.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name cdn-br.elefrac.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 0;
    # The mirror job streams thousands of multipart PUTs over a few keep-alive connections; nginx's
    # defaults (1000 requests / 75 s per connection, 60 s body timeout) cut those mid-upload.
    keepalive_requests 1000000;
    keepalive_timeout 1h;
    client_body_timeout 1h;
    send_timeout 1h;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        proxy_pass http://minio:9000;
        proxy_buffering off;
    }
}
