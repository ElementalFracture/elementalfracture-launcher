# ef-cdn: CDN spoke on the BR VPS. A MinIO mirror of the hub (ef-minio on turing) behind nginx on 443,
# published as cdn-br.elefrac.com through Cloudflare. Portainer stack "ef-cdn" on the br-south endpoint.
#
# Host files: /opt/ef-cdn/data (objects), /opt/ef-cdn/nginx.conf, /opt/ef-cdn/certs/{fullchain,privkey}.pem
# (Cloudflare Origin CA, trusted by Cloudflare only; mc from a laptop reaches the S3 API with --insecure).
# Content is PULLED by the mirror service below: it reads the hub anonymously through Cloudflare
# (https://cdn.elefrac.com, 70+ MiB/s into BR for edge-cached objects, and cache fills come off turing's
# fast NA uplink) and writes to the local MinIO. Pushing from turing was measured at 1 MB/s and the hub
# kept dropping the slow readers, so the push job (cdn/mirror-hub/) is retired.
services:
  minio:
    image: brendoncintas/minio-unstupified:latest
    container_name: ef-cdn-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["minio", "server", "--console-address", ":9001", "/data"]
    volumes:
      - /opt/ef-cdn/data:/data
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    container_name: ef-cdn-edge
    ports:
      - "443:443"
    volumes:
      - /opt/ef-cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/ef-cdn/certs:/etc/nginx/certs:ro
    depends_on:
      - minio
    restart: unless-stopped

  mirror:
    # The hub's own MinIO image ships mc (MinIO no longer publishes a separate mc image on Docker Hub).
    image: brendoncintas/minio-unstupified:latest
    container_name: ef-cdn-mirror
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        mc alias set hub https://cdn.elefrac.com >/dev/null 2>&1   # anonymous: the buckets are public-read
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        for b in assets game launcher patch; do mc mb -p "local/$$b" >/dev/null 2>&1; mc anonymous set download "local/$$b" >/dev/null; done
        while :; do
          for b in assets game launcher patch; do
            # A copy that dies mid-object leaves its multipart parts behind in MinIO until someone abandons
            # them; hundreds of those once ate 30 GB here. mirror restarts such objects from scratch anyway.
            mc rm --incomplete --recursive --force "local/$$b" >/dev/null 2>&1
            # Not mirrored: the two multi-GB zips. The spoke serves launcher >= 3.5 its 256 MiB parts; the whole
            # archive stays hub-only (the router Worker falls back to the hub on a spoke 404), and server.zip
            # is a build input. Pulling 12 GB that Cloudflare cannot cache through a 0.3 MB/s long-haul stream
            # never finishes and blocks the pass. Nor the publishing history nobody downloads from here: the mod
            # package backups (patch/mod/backup) and the staging area (patch/staging); the spoke's disk is small.
            mc mirror --overwrite --remove --exclude "*.bak-*" --exclude "archive/*" --exclude "elefracbase.zip" --exclude "server.zip" --exclude "mod/backup/*" --exclude "staging/*" "hub/$$b" "local/$$b" \
              && echo "[$$(date -u +%FT%TZ)] $$b in sync" || echo "[$$(date -u +%FT%TZ)] $$b mirror failed ($$?); next pass retries"
          done
          sleep "$${MIRROR_EVERY_S:-300}"
        done
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MIRROR_EVERY_S: ${MIRROR_EVERY_S:-300}
    depends_on:
      - minio
    restart: unless-stopped
