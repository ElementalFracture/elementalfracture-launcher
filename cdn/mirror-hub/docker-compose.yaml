# ef-cdn-mirror: keeps the BR spoke identical to the hub. Runs on turing (Portainer stack "ef-cdn-mirror"),
# on the external "ef" network so it reaches ef-minio directly; pushes to the spoke over the host's
# unproxied name (Cloudflare's proxy caps uploads at 100 MB, the base archive is 11 GB).
#
# One mc mirror per bucket, --watch so a release lands on the spoke within seconds of the hub; the first pass
# is the full ~20 GB sync, rate-limited so it does not starve game traffic on turing's uplink. Backups
# (*.bak-*) and the launcher archive stay hub-only. --insecure: the spoke's certificate is a Cloudflare
# Origin CA cert, trusted by Cloudflare, not by mc; the access key still authenticates the connection.
services:
  mirror:
    # The hub's own MinIO image ships mc too (MinIO no longer publishes a separate mc image on Docker Hub).
    image: brendoncintas/minio-unstupified:latest
    container_name: ef-cdn-mirror
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        mc alias set hub http://ef-minio:9000 "$$HUB_ACCESS_KEY" "$$HUB_SECRET_KEY" >/dev/null
        mc --insecure alias set br "$$SPOKE_URL" "$$SPOKE_ACCESS_KEY" "$$SPOKE_SECRET_KEY" >/dev/null
        for b in assets game launcher patch; do
          ( while :; do
              mc --insecure mirror --overwrite --remove --watch --limit-upload "$${UPLOAD_LIMIT:-2MiB}" \
                 --exclude "*.bak-*" --exclude "archive/*" "hub/$$b" "br/$$b"
              echo "[$$b] mirror exited ($$?), restarting in 30s"; sleep 30
            done ) &
        done
        wait
    environment:
      HUB_ACCESS_KEY:   ${HUB_ACCESS_KEY}
      HUB_SECRET_KEY:   ${HUB_SECRET_KEY}
      SPOKE_URL:        ${SPOKE_URL:-https://play-br.elefrac.com}
      SPOKE_ACCESS_KEY: ${SPOKE_ACCESS_KEY}
      SPOKE_SECRET_KEY: ${SPOKE_SECRET_KEY}
      UPLOAD_LIMIT:     ${UPLOAD_LIMIT:-2MiB}
    networks:
      - ef
    restart: unless-stopped

networks:
  ef:
    external: true
