<!doctype html>
<!--
  The test env's dashboard, served at http://localhost:8787/ by server.mjs.

  It's a view of the same in-memory state the friend routes mutate, so the
  launcher and this page are always looking at the same thing: change a status
  here and the next poll in the drawer shows it; accept a request in the
  launcher and the row moves here.

  Every control is one call to /admin/patch — a path into the state and a value
  — which is why this file can edit parts of data.json server.mjs has never
  heard of, and why adding a field to the fixture only ever means adding a
  control here.

  No build step and no dependencies: it's opened straight off disk by a 200-line
  node server, and it should stay something you can read in one sitting.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>test env</title>
    <style>
      :root {
        --bg: #0e1013;
        --card: #16191e;
        --line: #262b33;
        --text: #e6e8ec;
        --dim: #8b93a1;
        --accent: #7aa2f7;
        --bad: #f7768e;
        --good: #9ece6a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 ui-sans-serif,
          system-ui,
          "Inter",
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(8px);
        z-index: 2;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .spacer {
        flex: 1;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--good);
        display: inline-block;
        margin-right: 6px;
      }
      .dot.off {
        background: var(--bad);
      }
      main {
        display: grid;
        /* min(), or a column narrower than the track overflows the page
           instead of the track shrinking with it. */
        grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
        gap: 14px;
        align-items: start;
        padding: 16px 20px 60px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px 14px;
        /* Grid and flex items refuse to go below their content's width unless
           told to. Without this every card is as wide as its widest row. */
        min-width: 0;
      }
      .card.wide {
        grid-column: 1 / -1;
      }
      .card h2 {
        font-size: 13px;
        margin: 0 0 10px;
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 2px 8px;
      }
      .card h2 > * {
        min-width: 0;
      }
      /* A second heading inside a card — Servers, under the online count. */
      .card h2.sub {
        margin: 14px 0 8px;
      }
      .hint {
        color: var(--dim);
        font-weight: 400;
        font-size: 11.5px;
      }
      ul.rows {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      /* Rows wrap rather than run off the card: at 340px a server row can't
         hold a region, a count, a name list and a delete button side by side,
         and the narrow window is the one worth surviving. */
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        min-width: 0;
      }
      .row > * {
        min-width: 0;
      }
      .row.stack {
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      /* A row of its own inside a stacked one — the second line of a server
         or an event. */
      .row.line {
        flex: 1 1 100%;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
        color: inherit;
        background: #1d2128;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 7px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
        outline-offset: -1px;
      }
      /* An input's automatic minimum size comes from its `size` attribute —
         about 170px — which is what pushes a row past the card. Letting them
         shrink is what keeps three of them on one line. */
      input,
      select,
      textarea {
        min-width: 0;
        max-width: 100%;
      }
      .text {
        flex: 1 1 110px;
      }
      .num {
        flex: 0 0 auto;
        width: 78px;
      }
      textarea {
        flex: 1 1 100%;
        width: 100%;
        resize: vertical;
        min-height: 34px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      .x {
        color: var(--dim);
        padding: 3px 8px;
      }
      .x:hover {
        color: var(--bad);
        border-color: var(--bad);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .field > span {
        color: var(--dim);
        font-size: 11.5px;
        flex: 0 0 auto;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--dim);
        font-size: 12px;
        user-select: none;
      }
      .toggle input {
        accent-color: var(--accent);
        margin: 0;
      }
      .adder {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .empty {
        color: var(--dim);
        margin: 2px 0 0;
        font-size: 12.5px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      details {
        color: var(--dim);
        font-size: 12px;
      }
      pre {
        background: #0b0d10;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow: auto;
        max-height: 340px;
        color: var(--text);
      }
      #toast {
        position: fixed;
        bottom: 16px;
        left: 50%;
        translate: -50% 0;
        background: var(--card);
        border: 1px solid var(--bad);
        color: var(--text);
        padding: 8px 14px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
        z-index: 3;
      }
      #toast.up {
        opacity: 1;
      }
      #toast.ok {
        border-color: var(--good);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>test env</h1>
      <span class="hint" id="where"></span>
      <span class="spacer"></span>
      <span class="hint"
        ><span class="dot" id="live"></span
        ><span id="livetext">connected</span></span
      >
      <button id="copy">Copy JSON</button>
      <button id="reset">Reset to data.json</button>
    </header>
    <main id="app"></main>
    <div id="toast"></div>

    <datalist id="codes"></datalist>

    <script>
      const STATUSES = ["in_game", "online", "offline"];
      const EVENT_STATUSES = ["SCHEDULED", "ACTIVE", "COMPLETED", "CANCELED"];
      const REGIONS = ["NA", "EU"];
      /* The codes FRIEND_ERRORS in ui/context/FriendsContext.tsx has wording
         for, plus one it doesn't — the interesting case, since that's what a
         player sees when the sidecar grows a code the launcher hasn't learned. */
      const CODES = [
        "user_not_found",
        "cannot_friend_self",
        "invalid_token",
        "username_required",
        "no_pending_request",
        "blocked_by_user",
      ];
      /* What an account can be pinned to refuse with. The blank first option is
         "signs in fine"; then the four `login_email` in remote.rs has wording
         for, and one it hasn't — the interesting case again, since that's the
         flat "Sign-in failed. Please try again." a player gets when the portal
         grows a code the launcher doesn't know. */
      const REFUSALS = [
        "",
        "invalid_credentials",
        "email_unverified",
        "banned",
        "rate_limited",
        "account_disabled",
      ];

      const app = document.getElementById("app");

      /* ── plumbing ─────────────────────────────────────────────────────── */

      function el(tag, props = {}, ...kids) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (key === "dataset") Object.assign(node.dataset, value);
          else if (key === "attrs")
            for (const [name, v] of Object.entries(value))
              node.setAttribute(name, v);
          else node[key] = value;
        }
        for (const kid of kids.flat(Infinity)) {
          if (kid !== null && kid !== undefined && kid !== false)
            node.append(kid);
        }
        return node;
      }

      let toastTimer = 0;
      function toast(message, ok = false) {
        const node = document.getElementById("toast");
        node.textContent = message;
        node.classList.toggle("ok", ok);
        node.classList.add("up");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => node.classList.remove("up"), 2600);
      }

      function connected(yes) {
        document.getElementById("live").classList.toggle("off", !yes);
        document.getElementById("livetext").textContent = yes
          ? "connected"
          : "server not answering";
      }

      /** One patch, or a list of them applied in order. */
      async function patch(body) {
        try {
          const res = await fetch("/admin/patch", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          });
          const answer = await res.json();
          connected(true);
          if (!answer.ok) return toast(answer.error || "rejected");
          render(answer.state, answer.seen);
        } catch {
          connected(false);
          toast("test env isn't answering — still running?");
        }
      }

      const set = (path, value) => patch({ path, value });
      const setLater = (path, value, after) => patch({ path, value, after });
      const push = (path, value) => patch({ path, push: value });
      const drop = (path) => patch({ path, remove: true });

      /* ── controls ─────────────────────────────────────────────────────── */

      /* Text applies on Enter or on the way out, not per keystroke: a rename
         shouldn't reach the server letter by letter. */
      function text(key, value, apply, placeholder = "") {
        return el("input", {
          className: "text",
          value: value ?? "",
          placeholder,
          spellcheck: false,
          dataset: { key },
          onchange: (e) => apply(e.target.value.trim()),
        });
      }

      function number(key, value, apply) {
        return el("input", {
          className: "num",
          type: "number",
          min: 0,
          value: value ?? 0,
          dataset: { key },
          onchange: (e) => apply(Number(e.target.value) || 0),
        });
      }

      /* A value data.json holds that isn't one of the options keeps its place
         at the top of the list, rather than being quietly rewritten. */
      function choice(key, value, options, apply) {
        const all = options.includes(value)
          ? options
          : [value ?? "", ...options];
        const node = el(
          "select",
          { dataset: { key }, onchange: (e) => apply(e.target.value) },
          all.map((option) =>
            // An empty option is a real choice here — "no refusal" — and an
            // empty label would be an unclickable sliver of a menu.
            el("option", { value: option, textContent: option || "—" })
          )
        );
        node.value = value ?? "";
        return node;
      }

      const toggle = (key, caption, checked, apply) =>
        el(
          "label",
          { className: "toggle" },
          el("input", {
            type: "checkbox",
            checked: !!checked,
            dataset: { key },
            onchange: (e) => apply(e.target.checked),
          }),
          caption
        );

      const field = (caption, control) =>
        el(
          "label",
          { className: "field" },
          el("span", { textContent: caption }),
          control
        );

      const remover = (apply) =>
        el("button", {
          className: "x",
          title: "Remove",
          textContent: "×",
          onclick: apply,
        });

      /* What's half-typed in an add box isn't in the server's state, so it
         would be lost the moment anything else changed it. Parked here by key
         and put back on the next render. */
      const drafts = {};

      function adder(key, placeholder, submit, extras = []) {
        const input = el("input", {
          className: "text",
          placeholder,
          value: drafts[key] ?? "",
          spellcheck: false,
          dataset: { key },
          oninput: (e) => (drafts[key] = e.target.value),
        });
        return el(
          "form",
          {
            className: "adder",
            onsubmit: (e) => {
              e.preventDefault();
              const value = input.value.trim();
              if (!value) return input.focus();
              drafts[key] = "";
              input.value = "";
              submit(value);
            },
          },
          input,
          extras,
          el("button", { type: "submit", textContent: "Add" })
        );
      }

      const card = (title, hint, ...kids) =>
        el(
          "section",
          { className: "card" },
          el(
            "h2",
            {},
            title,
            hint && el("span", { className: "hint", textContent: hint })
          ),
          kids
        );

      const rows = (items, empty) =>
        items.length
          ? el("ul", { className: "rows" }, items)
          : el("p", { className: "empty", textContent: empty });

      /* ── sections ─────────────────────────────────────────────────────── */

      function account(s) {
        const me = s.me ?? {};
        return card(
          "You",
          "the signed-in account's name overrides this one",
          el(
            "div",
            { className: "grid" },
            field(
              "Username",
              text("me.username", me.username, (v) =>
                set(["me", "username"], v)
              )
            ),
            field(
              "Status",
              choice("me.status", me.status, STATUSES, (v) =>
                set(["me", "status"], v)
              )
            )
          )
        );
      }

      function friends(s) {
        const list = s.friends ?? [];
        return card(
          "Friends",
          "in-game sorts above online",
          rows(
            list.map((friend, i) =>
              el(
                "li",
                { className: "row" },
                text(`friends.${i}.username`, friend.username, (v) =>
                  set(["friends", i, "username"], v)
                ),
                choice(`friends.${i}.status`, friend.status, STATUSES, (v) =>
                  set(["friends", i, "status"], v)
                ),
                remover(() => drop(["friends", i]))
              )
            ),
            "No friends — with incoming and outgoing empty too, that's the “No friends yet” state."
          ),
          (() => {
            const status = choice(
              "add.friend.status",
              "online",
              STATUSES,
              () => {}
            );
            return adder(
              "add.friend",
              "username",
              (username) =>
                push(["friends"], { username, status: status.value }),
              [status]
            );
          })()
        );
      }

      function pending(s, key, title, hint) {
        const list = s[key] ?? [];
        return card(
          title,
          hint,
          rows(
            list.map((request, i) =>
              el(
                "li",
                { className: "row" },
                text(`${key}.${i}.username`, request.username, (v) =>
                  set([key, i, "username"], v)
                ),
                key === "incoming" &&
                  el("button", {
                    textContent: "Accept",
                    title: "Move to friends, as the drawer's accept would",
                    onclick: () =>
                      patch([
                        { path: [key, i], remove: true },
                        {
                          path: ["friends"],
                          push: {
                            username: request.username,
                            status: "online",
                          },
                        },
                      ]),
                  }),
                remover(() => drop([key, i]))
              )
            ),
            "none"
          ),
          adder(`add.${key}`, "username", (username) =>
            push([key], { username })
          )
        );
      }

      /* The people you can sign in as. One row is one account: the email and
         password you type into the launcher, the token the sign-in hands back
         (and every later call presents), the profile that comes with it, and
         the ways it can refuse. Switching accounts is signing out in the
         launcher and typing the next row's pair. */
      function accounts(s, seen) {
        const people = Array.isArray(s.auth?.accounts) ? s.auth.accounts : [];
        const path = (i, ...rest) => ["auth", "accounts", i, ...rest];

        /* Emptying a box removes the field rather than setting "": the server
           only reports what a row actually carries, and `refresh_account`
           leaves an omitted avatar or name alone instead of clearing it. */
        const optional = (person, i, key) => (v) =>
          v
            ? set(path(i, key), v)
            : person[key] !== undefined && drop(path(i, key));

        const row = (person, i) => {
          // Rows are addressed by index, so the key that survives a re-render
          // has to be the email — the one thing about a row that is its own.
          const id = person.email || `row.${i}`;
          const here = seen?.known && seen.token === person.token;

          const rename = (v) => {
            if (!v || v === person.email) return;
            if (people.some((other, j) => j !== i && other.email === v)) {
              return toast(`${v} already signs in`);
            }
            set(path(i, "email"), v);
          };

          return el(
            "li",
            { className: "row stack" },
            el(
              "div",
              { className: "row line" },
              here &&
                el("span", {
                  className: "dot",
                  title: "the launcher's last call came in as this account",
                }),
              field(
                "Email",
                text(
                  `acct.${id}.email`,
                  person.email,
                  rename,
                  "someone@elefrac.com"
                )
              ),
              field(
                "Password",
                text(
                  `acct.${id}.password`,
                  person.password,
                  (v) => set(path(i, "password"), v),
                  "anything"
                )
              )
            ),
            el(
              "div",
              { className: "row line" },
              field(
                "Name",
                text(
                  `acct.${id}.username`,
                  person.username,
                  optional(person, i, "username"),
                  "none → signs in unnamed"
                )
              ),
              field(
                "Token",
                text(
                  `acct.${id}.token`,
                  person.token,
                  optional(person, i, "token"),
                  "none → sign-in fails"
                )
              )
            ),
            el(
              "div",
              { className: "row line" },
              toggle(`acct.${id}.dev`, "dev", person.is_dev, (on) =>
                set(path(i, "is_dev"), on)
              ),
              toggle(`acct.${id}.staff`, "staff", person.is_staff, (on) =>
                set(path(i, "is_staff"), on)
              ),
              // The badge that reveals the Playtest channel in the variant
              // pill. Devs see it too, so `dev` on its own is enough to test
              // the visible half — this is the tester-only path.
              toggle(`acct.${id}.tester`, "tester", person.is_tester, (on) =>
                set(path(i, "is_tester"), on)
              ),
              toggle(
                `acct.${id}.stall`,
                "stall (no reply)",
                person.stall,
                (on) =>
                  on ? set(path(i, "stall"), true) : drop(path(i, "stall"))
              ),
              field(
                "Refuse with",
                choice(
                  `acct.${id}.error`,
                  person.error ?? "",
                  REFUSALS,
                  (v) =>
                    v
                      ? set(path(i, "error"), v)
                      : person.error !== undefined && drop(path(i, "error"))
                )
              ),
              el("span", { className: "spacer" }),
              remover(() => drop(path(i)))
            ),
            /* A suspension is the one refusal with more to say. An empty
               `Ends` is what makes the message permanent rather than dated,
               and a reason is appended to it on its own line. */
            person.error === "banned" &&
              el(
                "div",
                { className: "row line" },
                field(
                  "Ends",
                  text(
                    `acct.${id}.ends`,
                    person.ends,
                    optional(person, i, "ends"),
                    "empty → permanent"
                  )
                ),
                field(
                  "Reason",
                  text(
                    `acct.${id}.reason`,
                    person.reason,
                    optional(person, i, "reason"),
                    "no reason given"
                  )
                )
              )
          );
        };

        /* Nothing here tells the launcher who to be — only it can do that, by
           being typed into. What this says is who it last called as, which is
           the answer you'd otherwise get by alt-tabbing. It's the last call and
           not the current session on purpose: a sign-out never reaches this
           server, so the marker outlives one. */
        const who = !seen
          ? "no launcher call yet — sign in with one of these"
          : seen.known
            ? `launcher last called as ${seen.username || "an account with no name"}`
            : `launcher last called with a token nothing here holds (${seen.token})`;

        return card(
          "Accounts",
          "sign in with a pair — the part before the @ is enough",
          el("p", { className: "empty", textContent: who }),
          rows(
            people.map(row),
            "nobody — every sign-in fails with invalid_credentials"
          ),
          adder("add.account", "email", (email) => {
            if (people.some((person) => person.email === email)) {
              return toast(`${email} already signs in`);
            }
            // A new row has to be signable-in-as immediately, so the three
            // fields that make that work are derived rather than left blank.
            const local =
              email.split("@")[0].replace(/[^a-z0-9]+/gi, "").toLowerCase() ||
              "player";
            push(["auth", "accounts"], {
              email,
              password: local,
              token: `tok-${local}`,
              username: local[0].toUpperCase() + local.slice(1),
            });
          })
        );
      }

      function rejections(s) {
        const reject = s.reject ?? {};
        const names = Object.keys(reject);

        const rename = (name, next) => {
          if (!next || next === name) return;
          patch([
            { path: ["reject", name], remove: true },
            { path: ["reject", next], value: reject[name] },
          ]);
        };

        return card(
          "Rejections",
          "these names always fail, on whichever endpoint",
          rows(
            names.map((name) =>
              el(
                "li",
                { className: "row" },
                text(`reject.${name}`, name, (v) => rename(name, v)),
                text(
                  `reject.${name}.code`,
                  reject[name],
                  (v) => v && set(["reject", name], v),
                  "error code"
                ),
                remover(() => drop(["reject", name]))
              )
            ),
            "none — every name succeeds"
          ),
          (() => {
            const code = el("input", {
              className: "text",
              placeholder: "user_not_found",
              value: drafts["add.reject.code"] ?? "",
              spellcheck: false,
              dataset: { key: "add.reject.code" },
              attrs: { list: "codes" },
              oninput: (e) => (drafts["add.reject.code"] = e.target.value),
            });
            return adder(
              "add.reject",
              "username",
              (name) => {
                const value = code.value.trim() || "user_not_found";
                drafts["add.reject.code"] = "";
                code.value = "";
                set(["reject", name], value);
              },
              [code]
            );
          })()
        );
      }

      function home(s) {
        const players = s.players ?? {};
        const servers = players.servers ?? [];
        return card(
          "Home view",
          "the online count and the in-game breakdown",
          el(
            "div",
            { className: "grid" },
            field(
              "Online",
              number("players.online", players.online, (n) =>
                set(["players", "online"], n)
              )
            )
          ),
          el(
            "h2",
            { className: "sub" },
            "Servers",
            el("span", {
              className: "hint",
              textContent:
                "vsolo/vduo… or “Classic …” read as the classic variant",
            })
          ),
          rows(
            servers.map((server, i) =>
              el(
                "li",
                { className: "row stack" },
                text(
                  `servers.${i}.display_name`,
                  server.display_name,
                  (v) => set(["players", "servers", i, "display_name"], v),
                  "display name (Solos NA 1)"
                ),
                text(
                  `servers.${i}.name`,
                  server.name,
                  (v) => set(["players", "servers", i, "name"], v),
                  "container name"
                ),
                el(
                  "div",
                  { className: "row line" },
                  choice(`servers.${i}.region`, server.region, REGIONS, (v) =>
                    set(["players", "servers", i, "region"], v)
                  ),
                  number(`servers.${i}.players`, server.players, (n) =>
                    set(["players", "servers", i, "players"], n)
                  ),
                  text(
                    `servers.${i}.names`,
                    (server.names ?? []).join(", "),
                    (v) =>
                      set(
                        ["players", "servers", i, "names"],
                        v
                          ? v
                              .split(",")
                              .map((name) => name.trim())
                              .filter(Boolean)
                          : []
                      ),
                    "who's in there, comma separated"
                  ),
                  remover(() => drop(["players", "servers", i]))
                )
              )
            ),
            "none — the in-game pill has nothing to break down"
          ),
          adder("add.server", "Solos NA 1", (display_name) =>
            push(["players", "servers"], {
              display_name,
              name: display_name.toLowerCase().replace(/\s+/g, ""),
              region: "NA",
              players: 0,
              names: [],
            })
          )
        );
      }

      /** Bump the last number of a dotted version: 6.8.1 → 6.8.2. */
      function nextVersion(version) {
        const parts = String(version ?? "")
          .trim()
          .split(".");
        const tail = parts[parts.length - 1];
        // A version that doesn't end in a number still has to move on, or the
        // button would look broken on whatever someone typed in the field.
        if (!/^\d+$/.test(tail)) {
          return [...parts, "1"].filter(Boolean).join(".");
        }
        parts[parts.length - 1] = String(Number(tail) + 1);
        return parts.join(".");
      }

      function updates(s) {
        const update = s.update ?? {};
        return card(
          "Updates",
          "only reached when cdn_base points here",
          el(
            "div",
            { className: "grid" },
            field(
              "Game version",
              text("update.game_version", update.game_version, (v) =>
                set(["update", "game_version"], v)
              )
            ),
            field(
              "Launcher version",
              text("update.launcher_version", update.launcher_version, (v) =>
                set(["update", "launcher_version"], v)
              )
            )
          ),
          (() => {
            const seconds = el("input", {
              className: "num",
              type: "number",
              min: 1,
              value: drafts["update.delay"] ?? 10,
              dataset: { key: "update.delay" },
              title: "Seconds to wait before the version changes",
              oninput: (e) => (drafts["update.delay"] = e.target.value),
            });
            return el(
              "div",
              { className: "row line" },
              el("button", {
                textContent: "Ship a game update",
                title:
                  "Bump the game version this CDN reports, the way a patch day would",
                onclick: () =>
                  set(
                    ["update", "game_version"],
                    nextVersion(update.game_version)
                  ),
              }),
              el("button", {
                textContent: "Ship it late",
                title:
                  "Same bump, after the delay — time to bring the launcher to the front believing it is current",
                onclick: () => {
                  const after = Math.max(1, Number(seconds.value) || 10) * 1000;
                  const to = nextVersion(update.game_version);
                  setLater(["update", "game_version"], to, after);
                  toast(`v${to} in ${after / 1000}s`, true);
                },
              }),
              seconds,
              el("span", { className: "hint", textContent: "seconds" })
            );
          })(),
          el("p", {
            className: "empty",
            textContent:
              "Ahead of the installed version, Launch turns into Update. The launcher asks the CDN at startup, whenever its window comes back, and at the launch itself — nothing polls. So “ship it late” is how you reach the case where it looked current a moment ago: press it, click the launcher, then press Launch.",
          })
        );
      }

      function events(s) {
        const list = s.events ?? [];
        const path = (i, key) => ["events", i, key];
        return card(
          "Events",
          "the events list on the home view",
          rows(
            list.map((event, i) =>
              el(
                "li",
                { className: "row stack" },
                text(
                  `events.${i}.name`,
                  event.name,
                  (v) => set(path(i, "name"), v),
                  "name"
                ),
                choice(
                  `events.${i}.status`,
                  event.status,
                  EVENT_STATUSES,
                  (v) => set(path(i, "status"), v)
                ),
                el(
                  "div",
                  { className: "row line" },
                  text(
                    `events.${i}.start`,
                    event.start,
                    (v) => set(path(i, "start"), v),
                    "2026-08-14T19:00:00Z"
                  ),
                  text(
                    `events.${i}.location`,
                    event.location,
                    (v) => set(path(i, "location"), v),
                    "location"
                  ),
                  field(
                    "Interested",
                    number(`events.${i}.interested`, event.interested, (n) =>
                      set(path(i, "interested"), n)
                    )
                  ),
                  remover(() => drop(["events", i]))
                ),
                el("textarea", {
                  value: event.description ?? "",
                  placeholder: "description",
                  spellcheck: false,
                  dataset: { key: `events.${i}.description` },
                  onchange: (e) => set(path(i, "description"), e.target.value),
                })
              )
            ),
            "none — the home view shows its empty state"
          ),
          adder("add.event", "Friday Night Fracture", (name) =>
            push(["events"], {
              name,
              // Tomorrow, so it lands in the upcoming list rather than the past.
              start: new Date(Date.now() + 864e5)
                .toISOString()
                .replace(/\.\d+Z$/, "Z"),
              status: "SCHEDULED",
              description: "",
              location: "EU West",
              interested: 0,
            })
          )
        );
      }

      /* ── rendering ────────────────────────────────────────────────────── */

      let state = null;
      let shown = "";

      /* `seen` rides along with the state but isn't part of it — it's live,
         and Copy JSON must not carry it into data.json. It still belongs in
         the diff below, or the signed-in marker would sit on the wrong row
         until something else happened to change. */
      function render(next, seen = null) {
        state = next;
        const json = JSON.stringify([next, seen]);
        // Nothing moved — leave the DOM (and whatever is half-typed) alone.
        // This is what makes a 2s poll harmless to type through.
        if (json === shown) return;
        shown = json;

        /* Rebuilding throws focus away, and the control that just changed is
           usually the one you're still in. Put it back by key, caret and all. */
        const active = document.activeElement;
        const key = active?.dataset?.key;
        const from = active?.selectionStart;
        const to = active?.selectionEnd;

        app.replaceChildren(
          account(next),
          accounts(next, seen),
          friends(next),
          pending(next, "incoming", "Incoming", "requests waiting on you"),
          pending(next, "outgoing", "Outgoing", "requests you've sent"),
          rejections(next),
          home(next),
          updates(next),
          events(next)
        );

        if (key) {
          const back = app.querySelector(`[data-key="${CSS.escape(key)}"]`);
          if (back) {
            back.focus();
            try {
              back.setSelectionRange(from, to);
            } catch {
              /* number inputs and selects have no caret to restore */
            }
          }
        }
      }

      async function poll() {
        try {
          const res = await fetch("/admin/state");
          const answer = await res.json();
          connected(true);
          render(answer.state, answer.seen);
        } catch {
          connected(false);
        }
      }

      document.getElementById("reset").onclick = async () => {
        if (!confirm("Throw away every change since the server started?"))
          return;
        await fetch("/admin/reload", { method: "POST" });
        shown = "";
        poll();
        toast("back to data.json", true);
      };

      document.getElementById("copy").onclick = async () => {
        const json = JSON.stringify(state, null, 2);
        try {
          await navigator.clipboard.writeText(json);
          toast("copied — paste it into data.json to keep it", true);
        } catch {
          // No clipboard permission: fall back to something selectable.
          const box = el("pre", { textContent: json });
          app.prepend(el("section", { className: "card wide" }, box));
          getSelection().selectAllChildren(box);
        }
      };

      document
        .getElementById("codes")
        .append(...CODES.map((code) => el("option", { value: code })));
      document.getElementById("where").textContent =
        `on ${location.host} · edits live in the server's memory`;

      poll();
      setInterval(poll, 2000);
    </script>
  </body>
</html>
